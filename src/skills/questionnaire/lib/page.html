<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
/>
<style>
  /* Layout: one reading column of decision cards, then the answer block; a slim sticky bar tracks progress. */
  :root {
    --bg: #f3f5f8;
    --surface: #ffffff;
    --fg: #18202c;
    --muted: #586274;
    --line: #d7dce4;
    --accent: #1f5f8b;
    --accent-soft: #e3eef6;
    --block: #a4471b;
    --block-soft: #f8e9e1;
    --ok: #2c6e49;
    --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161c; --surface: #1a2029; --fg: #e5e9ef; --muted: #9aa4b4; --line: #2c3440;
      --accent: #6fb0dc; --accent-soft: #1c2f3e; --block: #e7905f; --block-soft: #3a261c; --ok: #74c597;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161c; --surface: #1a2029; --fg: #e5e9ef; --muted: #9aa4b4; --line: #2c3440;
    --accent: #6fb0dc; --accent-soft: #1c2f3e; --block: #e7905f; --block-soft: #3a261c; --ok: #74c597;
    color-scheme: dark;
  }
  body { background: var(--bg); color: var(--fg); font: 16px/1.55 var(--font-body); }
  .wrap { max-width: 46rem; margin: 0 auto; padding-inline: 16px; padding-block: 1.5rem 3rem; display: grid; gap: 1.25rem; }
  h1, h2 { text-wrap: balance; line-height: 1.25; margin: 0; }
  h1 { font-size: 1.75rem; font-weight: 600; }
  h2 { font-size: 1.25rem; font-weight: 600; }
  h3 { font: 500 0.75rem/1.4 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 0.25rem; }
  p { margin: 0 0 0.5rem; }
  p:last-child { margin-bottom: 0; }
  ul, ol { margin: 0 0 0.5rem; padding-left: 1.25rem; }
  code { font: 0.9em var(--font-mono); background: var(--accent-soft); padding: 0 0.25em; border-radius: 3px; }
  a { color: var(--accent); }
  .md-h { font-weight: 600; }
  .intro { color: var(--muted); max-width: 65ch; }
  .bar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem 1rem;
    background: var(--bg); border-bottom: 1px solid var(--line); padding-block: 0.5rem;
  }
  .bar a { font-weight: 500; }
  #q-progress { font: 500 0.875rem var(--font-mono); font-variant-numeric: tabular-nums; }
  #q-list { display: grid; gap: 1.25rem; }
  .q { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 1.25rem; display: grid; gap: 0.875rem; min-width: 0; }
  .q-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
  .q-id { font: 500 0.8125rem var(--font-mono); color: var(--muted); }
  .chip { font-size: 0.75rem; font-weight: 500; letter-spacing: 0.02em; padding: 0.1rem 0.5rem; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .chip-block { background: var(--block-soft); color: var(--block); }
  .q-state { margin-left: auto; font: 500 0.75rem var(--font-mono); }
  .q-state.is-open { color: var(--muted); }
  .q-state.is-done { color: var(--ok); }
  .q-sec { min-width: 0; overflow-wrap: anywhere; }
  /* With images, the page widens so pictures sit side by side; text stays at reading width. */
  body.has-images .wrap { max-width: 72rem; }
  body.has-images :is(.intro, .q h2, .q-sec, .opts:not(.opts-visual) .opt, .note-label, .note) { max-width: 46rem; }
  .figs { display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); }
  .fig { display: grid; gap: 0.25rem; min-width: 0; align-content: start; }
  .zoom { display: block; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); cursor: zoom-in; overflow: hidden; }
  .zoom:hover { border-color: var(--accent); }
  .zoom img { display: block; width: 100%; height: auto; max-height: 70vh; object-fit: contain; }
  .cap { font-size: 0.8125rem; color: var(--muted); }
  .opts-visual { grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr)); align-items: stretch; }
  .opts-visual .opt-idk { grid-column: 1 / -1; }
  .opt-figs { padding: 0 0.75rem 0.75rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 10rem), 1fr)); }
  .opt-figs .zoom img { max-height: 50vh; }
  /* Lightbox: fit to the screen; click the picture for actual size, then scroll. */
  #q-box { width: 100vw; height: 100dvh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: rgb(8 10 14 / 0.98); color: #e5e9ef; }
  #q-box::backdrop { background: rgb(8 10 14 / 0.7); }
  #q-box[open] { display: grid; grid-template-rows: auto 1fr auto; }
  .box-bar { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 16px; }
  .box-bar button { background: transparent; color: inherit; border-color: rgb(255 255 255 / 0.3); }
  #q-box-count { font: 500 0.875rem var(--font-mono); font-variant-numeric: tabular-nums; margin-right: auto; }
  #q-box.is-single #q-box-prev, #q-box.is-single #q-box-next { display: none; }
  #q-box-stage { overflow: auto; display: grid; place-items: center; min-height: 0; padding: 0 16px; }
  #q-box-img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; }
  #q-box.is-actual #q-box-stage { place-items: start; }
  #q-box.is-actual #q-box-img { max-width: none; max-height: none; cursor: zoom-out; }
  #q-box-cap { padding: 0.5rem 16px 0.75rem; font-size: 0.9375rem; text-align: center; min-height: 1.5em; }
  .opts { border: 0; margin: 0; padding: 0; display: grid; gap: 0.5rem; min-width: 0; }
  .opts legend { font: 500 0.75rem/1.4 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 0; margin-bottom: 0.5rem; }
  .opt { display: grid; border: 1px solid var(--line); border-radius: 4px; min-width: 0; }
  .opt:hover { border-color: var(--accent); }
  .opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .opt-main { display: flex; gap: 0.75rem; align-items: flex-start; padding: 0.75rem; cursor: pointer; }
  .opt input { margin-top: 0.3rem; accent-color: var(--accent); flex: none; }
  .opt-body { display: grid; gap: 0.125rem; min-width: 0; overflow-wrap: anywhere; }
  .opt-label { font-weight: 600; }
  .opt-desc { color: var(--muted); font-size: 0.9375rem; }
  .opt-idk { border-style: dashed; }
  .note-label { font-size: 0.875rem; color: var(--muted); }
  textarea { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 0.5rem; width: 100%; box-sizing: border-box; resize: vertical; }
  .note { margin-top: -0.5rem; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .answers { background: var(--surface); border: 1px solid var(--accent); border-radius: 6px; padding: 1.25rem; display: grid; gap: 0.75rem; min-width: 0; }
  .answers p { color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  button { font: 500 0.9375rem var(--font-body); padding: 0.5rem 0.875rem; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
  #q-output, #q-plain { font: 0.8125rem/1.5 var(--font-mono); }
  #q-output { min-height: 14rem; }
  #q-plain { margin: 0; padding: 0.75rem; border: 1px solid var(--line); border-radius: 4px; white-space: pre-wrap; overflow-wrap: anywhere; user-select: all; -webkit-user-select: all; }
  .status { min-height: 1.5em; font-size: 0.875rem; margin: 0; }
  .status.is-ok { color: var(--ok); }
  .status.is-warn { color: var(--block); }
  .reset { justify-self: start; font-size: 0.8125rem; color: var(--muted); }
  @media (prefers-reduced-motion: no-preference) { .opt { transition: border-color 0.15s, background 0.15s; } }
</style>

<div class="wrap">
  <header>
    <h1>__TITLE__</h1>
  </header>
  <div class="intro" id="q-intro"></div>
  <div class="bar"><span id="q-progress"></span><a href="#answers">Go to your answers</a></div>
  <div id="q-list"></div>
  <section class="answers" id="answers">
    <h2>Your answers</h2>
    <p>
      Copy this block and paste it into the chat. It updates as you answer, and unanswered questions
      are listed so you can send a partial set.
    </p>
    <div class="actions">
      <button type="button" class="primary" id="q-copy">Copy answers</button>
      <button type="button" id="q-select">Select all</button>
      <button type="button" id="q-plain-toggle">Show as plain text</button>
    </div>
    <p class="status" id="q-status" role="status" aria-live="polite"></p>
    <textarea
      id="q-output"
      readonly
      spellcheck="false"
      aria-label="Answer text to paste into the chat"
    ></textarea>
    <pre id="q-plain" hidden></pre>
    <button type="button" class="reset" id="q-reset">Clear answers</button>
  </section>
</div>

<dialog id="q-box" aria-label="Image viewer">
  <div class="box-bar">
    <span id="q-box-count"></span>
    <button type="button" id="q-box-prev" aria-label="Previous image">&larr; Prev</button>
    <button type="button" id="q-box-next" aria-label="Next image">Next &rarr;</button>
    <button type="button" id="q-box-close" autofocus>Close</button>
  </div>
  <div id="q-box-stage"><img id="q-box-img" alt="" /></div>
  <p id="q-box-cap"></p>
</dialog>

<script type="application/json" id="q-spec">
  __SPEC__
</script>
<script>
  __APP__
</script>
