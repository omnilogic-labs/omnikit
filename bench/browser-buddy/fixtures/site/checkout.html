<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Checkout</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <h1>Checkout</h1>
    <p>Titanium bracket, 12mm &times; 2. Order total $74.50.</p>

    <form id="checkout-form" action="/receipt" method="get" novalidate>
      <label for="fullname">Cardholder name</label>
      <input id="fullname" name="fullname" type="text" />

      <label for="email">Email address for the receipt</label>
      <input id="email" name="email" type="text" />

      <label for="card">Card number</label>
      <input
        id="card"
        name="card"
        type="text"
        inputmode="numeric"
        placeholder="4242 4242 4242 4242"
      />

      <label for="expiry">Expiry</label>
      <input id="expiry" name="expiry" type="text" placeholder="MM/YY" />

      <label for="cvc">CVC</label>
      <input id="cvc" name="cvc" type="text" placeholder="123" />

      <button type="submit">Pay $74.50</button>
    </form>

    <div id="errors" hidden class="confirm"></div>

    <p><a href="/">Back to index</a></p>

    <script>
      // Card, expiry, CVC and name are all validated.
      //
      // Planted defect: the email field is never validated. Anything at all is
      // accepted, including an obviously malformed address, and the form submits
      // to the receipt page as though the address were fine. The field is also
      // type="text" rather than type="email", so the browser does not catch it.
      document.getElementById("checkout-form").addEventListener("submit", function (event) {
        var problems = [];
        var name = document.getElementById("fullname").value.trim();
        var card = document.getElementById("card").value.replace(/\s+/g, "");
        var expiry = document.getElementById("expiry").value.trim();
        var cvc = document.getElementById("cvc").value.trim();

        if (!name) problems.push("Cardholder name is required.");
        if (!/^\d{16}$/.test(card)) problems.push("Card number must be 16 digits.");
        if (!/^\d{2}\/\d{2}$/.test(expiry)) problems.push("Expiry must be in MM/YY format.");
        if (!/^\d{3}$/.test(cvc)) problems.push("CVC must be 3 digits.");

        var box = document.getElementById("errors");
        if (problems.length) {
          event.preventDefault();
          box.hidden = false;
          box.style.background = "#fdeeee";
          box.style.borderColor = "#e0b4b4";
          box.textContent = problems.join(" ");
          return;
        }
        box.hidden = true;
      });
    </script>
  </body>
</html>
